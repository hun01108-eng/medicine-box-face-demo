[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medicine-box-face-demo"
version = "0.1.0"
description = "Raspberry Pi face selector and thermal passage detector for a medicine box"
requires-python = ">=3.10"

[project.scripts]
facebox = "facebox.app:main"
medicine-box-demo = "facebox.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
