[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medicine-box-face-demo"
version = "0.1.0"
description = "Privacy-first single-person face selector for Raspberry Pi"
requires-python = ">=3.10"

[project.scripts]
facebox = "facebox.app:main"

[tool.setuptools.packages.find]
where = ["src"]
