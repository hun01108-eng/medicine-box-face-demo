[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medicine-box-face-selector"
version = "0.2.0"
description = "Privacy-first single-person face selector for a Raspberry Pi medicine box"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-contrib-python>=4.8,<5"
]

[project.scripts]
facebox = "facebox.app:main"

[tool.setuptools.packages.find]
where = ["src"]
