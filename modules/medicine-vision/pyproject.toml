[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medicine-box-vision"
version = "0.1.0"
description = "Standalone green/red inventory vision module"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
medicine-vision = "medicine_vision.app:main"

[tool.setuptools.packages.find]
where = ["src"]
